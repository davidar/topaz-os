# Weekly refresh of the image's repository-tracking inputs (ledgers 0022,
# 0052).
#
# The base image digest and the package lockfile must move atomically: the
# lock records the package delta relative to the pinned base, so bumping
# one without the other fails the build's lockfile assertion by design.
# The same holds for the builder stages' fedora digest and their toolchain
# locks. Renovate cannot regenerate rpm lockfiles, so digest updates for
# both images are disabled in renovate.json5 and owned here instead: this
# workflow resolves the current digests, replays the package transactions
# against them, and opens one pull request carrying every change —
# always self-consistent, CI-green on arrival.
#
# Scheduled a day ahead of build.yml's Saturday reproducibility rebuild.
#
# Requires the repository setting "Allow GitHub Actions to create and
# approve pull requests". PRs created with GITHUB_TOKEN do not trigger
# pull_request workflows, so the last step dispatches build.yml against
# the branch explicitly (workflow_dispatch is the documented exception to
# that rule); its check run attaches to the PR's head commit.

name: Refresh image inputs

on:
  schedule:
    - cron: '0 16 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bump base image digest
        run: |
          set -euo pipefail
          command -v skopeo > /dev/null || sudo apt-get install -y skopeo
          # Guard: fail loudly if the FROM line no longer looks as expected.
          grep -Eq '^FROM ghcr\.io/ublue-os/bluefin-dx-nvidia-open:latest@sha256:[0-9a-f]+$' Containerfile
          digest=$(skopeo inspect --no-tags --format '{{.Digest}}' \
              docker://ghcr.io/ublue-os/bluefin-dx-nvidia-open:latest)
          sed -E -i \
              "s|(bluefin-dx-nvidia-open:latest@)sha256:[0-9a-f]+|\1${digest}|" \
              Containerfile
          echo "Base digest: ${digest}"

      - name: Bump the builder stages' fedora digest
        run: |
          set -euo pipefail
          # Both builder stages start from one fedora tag at one digest;
          # their toolchain locks (ledger 0052) are resolved against it.
          # The tag itself (the release) moves by hand with the base's.
          tag=$(grep -oP '^FROM \Kregistry\.fedoraproject\.org/fedora:[0-9]+(?=@sha256:[0-9a-f]+ AS )' Containerfile | sort -u)
          [ "$(wc -l <<< "$tag")" -eq 1 ]
          # The index digest, as Renovate pinned it (plain inspect's
          # .Digest names the amd64 child).
          digest=sha256:$(skopeo inspect --no-tags --raw "docker://${tag}" | sha256sum | cut -d' ' -f1)
          sed -E -i \
              "s|(registry\.fedoraproject\.org/fedora:[0-9]+@)sha256:[0-9a-f]+|\1${digest}|" \
              Containerfile
          echo "Builder digest: ${tag}@${digest}"

      - name: Regenerate the lockfiles against the (possibly bumped) images
        run: bash build_files/gen-lockfile.sh

      - name: Open a pull request if any input moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Containerfile 'build_files/*.lock'; then
            echo "Digests and lockfiles unchanged; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="refresh-inputs-$(date -u +%Y%m%d)"
          git checkout -b "$branch"
          git add Containerfile 'build_files/*.lock'
          git commit -m "Refresh image digests and lockfiles"
          git push -u origin "$branch"
          {
            echo "Automated weekly input refresh (see ledgers 0022 and 0052)."
            echo
            echo '```'
            git diff HEAD~1 --stat -- Containerfile 'build_files/*.lock'
            echo '```'
            echo
            echo "Each image digest and the lockfiles resolved against it"
            echo "move together so the build's lockfile assertions hold. A CI"
            echo "build for this branch is dispatched by the workflow that"
            echo "opened this PR."
          } > /tmp/pr-body.md
          gh pr create \
            --title "Refresh image inputs ($(date -u +%Y-%m-%d))" \
            --body-file /tmp/pr-body.md \
            --base main --head "$branch"
          gh workflow run build.yml --ref "$branch"
