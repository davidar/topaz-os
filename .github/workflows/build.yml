---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    # Weekly safety net: the base image is digest-pinned (Renovate PRs cover
    # its bumps), so scheduled rebuilds only refresh the unpinned dnf layer.
    # Saturday 16:00 UTC = quiet local hours, clear of interactive pushes.
    - cron: '0 16 * * 6'
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  # false: a newly queued run waits instead of killing an in-progress build
  # (stale *pending* runs are still superseded). A scheduled run once
  # cancelled a release build 22 minutes in; never again.
  cancel-in-progress: false

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          sudo -E $(command -v just) build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # Tag generation must run before the rechunk action: it drops scratch
      # files (previous.manifest.json, the OCI output dir) into the
      # workspace, and generate-build-tags omits the per-commit tags when
      # the git tree is dirty.
      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      # Rechunk the image so updates only download what changed. rpm-ostree's
      # chunker groups all non-package content — the initramfs plus every
      # topaz-authored file — into a single ~600MB layer, so any one-line
      # change re-downloaded all of it. rechunk groups packages by update
      # cadence, splits unpackaged content, and reuses the previous published
      # image's layer plan (prev-ref) so unchanged content keeps identical
      # layer digests. It is the same tool Bluefin uses to chunk the base
      # image. The rechunked image drops the labels of its input, so collect
      # them first and pass them through — except labels the rechunker owns:
      # dev.hhd.* is its plan/info metadata (the base image's own copy is
      # inherited by our build and would override the freshly computed one,
      # breaking prev-ref plan reuse), and ostree.commit/final-diffid are
      # stale base values it regenerates. Label values must stay free of
      # double quotes: the action substitutes them textually into a shell
      # command, which strips quoting (that is how the inherited base label
      # broke plan reuse before the dev.hhd exclusion).
      - name: Collect image labels
        id: labels
        run: |
          {
            echo 'labels<<EOF'
            sudo podman inspect localhost/${IMAGE_NAME}:${DEFAULT_TAG} \
              | jq -r '.[0].Config.Labels
                       | del(.["org.opencontainers.image.version"],
                             .["ostree.commit"], .["ostree.final-diffid"],
                             .["io.artifacthub.package.maintainers"])
                       | with_entries(select(.key | startswith("dev.hhd") | not))
                       | to_entries[] | "\(.key)=\(.value)"'
            echo 'EOF'
            echo "version=$(sudo podman inspect localhost/${IMAGE_NAME}:${DEFAULT_TAG} \
              | jq -r '.[0].Config.Labels["org.opencontainers.image.version"]')"
          } >> $GITHUB_OUTPUT

      - name: Rechunk image
        id: rechunk
        uses: hhd-dev/rechunk@5fbe1d3a639615d2548d83bc888360de6267b1a2 # v1.2.4
        with:
          ref: localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          prev-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          rechunk: ghcr.io/hhd-dev/rechunk:v1.2.4@sha256:8a84bd5a029681aa8db523f927b7c53b5aded9b078b81605ac0a2fedc969f528
          version: ${{ steps.labels.outputs.version }}
          labels: ${{ steps.labels.outputs.labels }}

      - name: Load rechunked image
        run: |
          sudo skopeo copy ${{ steps.rechunk.outputs.ref }} \
            containers-storage:localhost/${IMAGE_NAME}:${DEFAULT_TAG}
          sudo rm -rf ${{ steps.rechunk.outputs.location }}

      # The Containerfile check gate ran before rechunking; re-run it on the
      # artifact that actually ships, so a rechunker regression fails the
      # build rather than the deployment. The sidecar assertion must run in
      # its own container first: topaz check's rpm queries recreate the
      # sidecars, so only a pristine container reflects shipped content
      # (ledger 0020).
      - name: Verify rechunked image
        run: |
          sudo podman run --rm localhost/${IMAGE_NAME}:${DEFAULT_TAG} \
            bash -c 'test ! -e /usr/share/rpm/rpmdb.sqlite-wal &&
                     test ! -e /usr/share/rpm/rpmdb.sqlite-shm'
          sudo podman run --rm localhost/${IMAGE_NAME}:${DEFAULT_TAG} topaz check

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          sudo -E $(command -v just) tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            sudo -E podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        # https://github.com/containers/container-libs/issues/388
        with:
          cosign-release: 'v2.6.4'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # Skip the Rekor transparency log: nothing in the podman/bootc
          # verification path consults it (verification is purely against
          # cosign.pub), and the upload adds a flaky network dependency.
          cosign sign --tlog-upload=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

