---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    # Weekly reproducibility check, not an update channel: every image input
    # is pinned by the git tree (base digest, packages.lock, comp REF), so a
    # rebuild of an unchanged tree must reproduce the published image.
    # Scheduled runs rebuild HEAD, compare layers against :latest, and never
    # push — any layer divergence fails the run. Saturday 16:00 UTC, a day
    # after refresh-inputs.yml's Friday PR.
    - cron: '0 16 * * 6'
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  # false: a newly queued run waits instead of killing an in-progress build
  # (stale *pending* runs are still superseded). A scheduled run once
  # cancelled a release build 22 minutes in; never again.
  cancel-in-progress: false

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # Login happens before the build so the registry layer cache is
      # readable (the cache package is private) and, on main, writable.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This actually builds the container image. Runners are stateless, so
      # unchanged expensive layers (compositor toolchain + build, the locked
      # package install) come from a registry cache instead of rebuilding.
      # Scheduled runs build cold on purpose — they exist to prove a real
      # rebuild reproduces the published image, and a cache hit would prove
      # nothing. Only main pushes write the cache, so branches can't poison
      # it.
      - name: Build Image
        id: build-image
        env:
          CACHE_FROM: ${{ github.event_name != 'schedule' && format('{0}/{1}-build-cache', env.IMAGE_REGISTRY, env.IMAGE_NAME) || '' }}
        run: |
          sudo -E $(command -v just) build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # Populate the registry layer cache only after the gated build
      # succeeded. --cache-to on the build itself uploads entries as each
      # step completes, so a build that later fails its gate has already
      # poisoned the cache — and podman never overwrites an existing cache
      # key, so a bad entry does not self-heal (2026-08-12: a torn rpmdb
      # from a failed push build was served to every later run; recovery
      # is deleting that version from the topaz-os-build-cache package).
      # Known limitation: the runner's buildah (1.33) never serves RUN
      # steps that bind-mount from another stage out of cache, so this
      # re-run rebuilds the final-stage layers instead of reusing the
      # gated ones (each layer still self-verifies its rpm database:
      # census assert, sqlite integrity check, fatal rpm stderr), and
      # Build Image gets no cache benefit for them either. With
      # buildah >= 1.35 both become cache hits.
      - name: Push Build Cache
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          CACHE_TO: ${{ format('{0}/{1}-build-cache', env.IMAGE_REGISTRY, env.IMAGE_NAME) }}
        run: |
          sudo -E $(command -v just) build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # Rewrite the gated build into content-based layers (ledger 0028):
      # roughly one layer per package, the rpm database in its own, so
      # machines download only the packages that changed instead of whole
      # locked-install layers. The Containerfile's coarse layers remain the
      # build-cache units; this reshapes only the published artifact. The
      # rewrite is deterministic (SOURCE_DATE_EPOCH=0), so the scheduled
      # reproducibility check below compares chunked output like-for-like.
      - name: Chunk Image
        id: chunk-image
        run: |
          sudo -E $(command -v just) chunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG} \
            /tmp/chunked-oci

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      # Scheduled runs exist to answer one question: does rebuilding the
      # unchanged tree reproduce the published artifact? Compare uncompressed
      # layer digests (diff_ids — compression-independent) of this rebuild's
      # chunked output against :latest. The build (--timestamp 0) and the
      # chunk rewrite (SOURCE_DATE_EPOCH=0) are both deterministic, so any
      # divergence at all is a regression.
      - name: Compare rebuild against published image
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          ref=docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:latest
          pub_ver=$(skopeo inspect --no-tags \
              --format '{{index .Labels "org.opencontainers.image.version"}}' "$ref")
          if [[ "$pub_ver" != *"-${GITHUB_SHA:0:7}"* ]]; then
            echo "::notice::published :latest ($pub_ver) is not built from HEAD" \
                 "(${GITHUB_SHA:0:7}); skipping the equivalence check"
            exit 0
          fi
          skopeo inspect --no-tags --config "$ref" \
            | jq -r '.rootfs.diff_ids[]' | sort > /tmp/published.diffids
          manifest=$(sudo jq -r '.manifests[0].digest' /tmp/chunked-oci/index.json | cut -d: -f2)
          config=$(sudo jq -r '.config.digest' "/tmp/chunked-oci/blobs/sha256/${manifest}" | cut -d: -f2)
          sudo jq -r '.rootfs.diff_ids[]' "/tmp/chunked-oci/blobs/sha256/${config}" \
            | sort > /tmp/rebuilt.diffids
          if diff /tmp/published.diffids /tmp/rebuilt.diffids; then
            echo "REPRODUCIBLE: rebuild is layer-identical to the published image."
          else
            echo "REPRODUCIBILITY REGRESSION: rebuild diverges from the" \
                 "published image (diff above)." >&2
            exit 1
          fi

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      # The chunked OCI directory is what ships; skopeo preserves its
      # manifest (layer set, annotations) byte-for-byte, where podman push
      # would re-encode it.
      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            sudo -E skopeo copy --digestfile=/tmp/digestfile oci:/tmp/chunked-oci docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        # https://github.com/containers/container-libs/issues/388
        with:
          cosign-release: 'v2.6.5'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # Skip the Rekor transparency log: nothing in the podman/bootc
          # verification path consults it (verification is purely against
          # cosign.pub), and the upload adds a flaky network dependency.
          cosign sign --tlog-upload=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

