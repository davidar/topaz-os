---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    # Weekly reproducibility check, not an update channel: every image input
    # is pinned by the git tree (base digest, packages.lock, comp REF), so a
    # rebuild of an unchanged tree must reproduce the published image.
    # Scheduled runs rebuild HEAD, compare layers against :latest, and never
    # push — any layer divergence fails the run. Saturday 16:00 UTC, a day
    # after refresh-inputs.yml's Friday PR.
    - cron: '0 16 * * 6'
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  # Canonical publish target (ledger 0033). quay serves the multi-range
  # blob requests that zstd:chunked partial pulls are made of; GHCR
  # rejects them (501), so it is kept as a best-effort mirror instead.
  # Publishing away from GitHub also keeps machine updates available
  # while GitHub itself is down.
  PUBLISH_REGISTRY: "quay.io/davidar"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  # false: a newly queued run waits instead of killing an in-progress build
  # (stale *pending* runs are still superseded). A scheduled run once
  # cancelled a release build 22 minutes in; never again.
  cancel-in-progress: false

jobs:
  build_push:
    name: Build and push image
    # ubuntu-26.04 (preview) for its podman 5.7 / buildah 1.42: the 24.04
    # runner's buildah 1.33 never served RUN steps that bind-mount from
    # another stage out of cache, which is every final-stage layer here —
    # they rebuilt on all runs, cache or not. If the preview runner
    # misbehaves (capacity, image churn), reverting to ubuntu-24.04 only
    # costs that caching. The first run after a builder version change
    # builds cold: the old cache entries no longer key-match.
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      # Background resource sampler, reported by the last step: the
      # conversion OOM kills (exit 137, 2026-08-15) were diagnosed blind
      # from blob timestamps; the next resource exhaustion should name
      # itself. Background processes survive across steps within a job.
      - name: Start resource sampler
        run: |
          cat > ${RUNNER_TEMP}/sample.sh <<'EOF'
          while true; do
            printf '%s avail_mem=%sMiB tmp_used=%sMiB root_free=%sMiB\n' \
              "$(date -u +%H:%M:%S)" \
              "$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)" \
              "$(df -m --output=used /tmp | tail -1 | tr -d ' ')" \
              "$(df -m --output=avail / | tail -1 | tr -d ' ')"
            sleep 15
          done
          EOF
          nohup bash ${RUNNER_TEMP}/sample.sh >> ${RUNNER_TEMP}/resources.log 2>/dev/null &

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # Login is for the push steps: reading the layer cache needs no
      # auth (the cache package is public). The credentials land in the
      # runner user's ~/.docker/config.json — steps that run podman or
      # skopeo under sudo do not inherit them (sudo resets HOME) and must
      # point REGISTRY_AUTH_FILE at that file explicitly.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both logins land in the same ~/.docker/config.json, so the one
      # REGISTRY_AUTH_FILE mount below authenticates the canonical quay
      # push and the GHCR mirror alike.
      - name: Login to Quay
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USER }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      # This actually builds the container image. Runners are stateless, so
      # unchanged expensive layers (compositor toolchain + build, the locked
      # package install) come from a registry cache instead of rebuilding.
      # Scheduled runs build cold on purpose — they exist to prove a real
      # rebuild reproduces the published image, and a cache hit would prove
      # nothing. Only main pushes write the cache, so branches can't poison
      # it.
      - name: Build Image
        id: build-image
        env:
          CACHE_FROM: ${{ github.event_name != 'schedule' && format('{0}/{1}-build-cache', env.IMAGE_REGISTRY, env.IMAGE_NAME) || '' }}
        # --preserve-env=<list>, not -E: the 26.04 runner's sudo is
        # sudo-rs, which ignores blanket -E with only a warning — the
        # cache env vars silently never reached the build (2026-08-13).
        # The targeted list form works in both sudo-rs and classic sudo.
        run: |
          sudo --preserve-env=CACHE_FROM $(command -v just) build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # Rewrite the gated build into content-based layers (ledger 0028):
      # roughly one layer per package, the rpm database in its own, so
      # machines download only the packages that changed instead of whole
      # locked-install layers. The Containerfile's coarse layers remain the
      # build-cache units; this reshapes only the published artifact. The
      # rewrite is deterministic (SOURCE_DATE_EPOCH=0), so the scheduled
      # reproducibility check below compares chunked output like-for-like.
      # OCI directories live under RUNNER_TEMP (disk-backed), NOT /tmp:
      # the 26.04 runner mounts /tmp as a 7.9 G RAM-backed tmpfs, and the
      # chunked image plus its zstd conversion is ~9.6 G — filling that
      # tmpfs OOM-killed the conversion twice (exit 137) before the cause
      # was found.
      - name: Chunk Image
        id: chunk-image
        run: |
          sudo $(command -v just) chunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG} \
            ${RUNNER_TEMP}/chunked-oci

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      # Scheduled runs exist to answer one question: does rebuilding the
      # unchanged tree reproduce the published artifact? Compare uncompressed
      # layer digests (diff_ids — compression-independent) of this rebuild's
      # chunked output against :latest. The build (--timestamp 0) and the
      # chunk rewrite (SOURCE_DATE_EPOCH=0) are both deterministic, so any
      # divergence at all is a regression.
      - name: Compare rebuild against published image
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          ref=docker://${PUBLISH_REGISTRY}/${IMAGE_NAME}:latest
          pub_ver=$(skopeo inspect --no-tags \
              --format '{{index .Labels "org.opencontainers.image.version"}}' "$ref")
          if [[ "$pub_ver" != *"-${GITHUB_SHA:0:7}"* ]]; then
            echo "::notice::published :latest ($pub_ver) is not built from HEAD" \
                 "(${GITHUB_SHA:0:7}); skipping the equivalence check"
            exit 0
          fi
          skopeo inspect --no-tags --config "$ref" \
            | jq -r '.rootfs.diff_ids[]' | sort > /tmp/published.diffids
          manifest=$(sudo jq -r '.manifests[0].digest' ${RUNNER_TEMP}/chunked-oci/index.json | cut -d: -f2)
          config=$(sudo jq -r '.config.digest' "${RUNNER_TEMP}/chunked-oci/blobs/sha256/${manifest}" | cut -d: -f2)
          sudo jq -r '.rootfs.diff_ids[]' "${RUNNER_TEMP}/chunked-oci/blobs/sha256/${config}" \
            | sort > /tmp/rebuilt.diffids
          if diff /tmp/published.diffids /tmp/rebuilt.diffids; then
            echo "REPRODUCIBLE: rebuild is layer-identical to the published image."
          else
            echo "REPRODUCIBILITY REGRESSION: rebuild diverges from the" \
                 "published image (diff above)." >&2
            exit 1
          fi

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      #
      # The push recompresses the chunked image as zstd:chunked (ledger
      # 0031): identical layers (diff_ids unchanged — the reproducibility
      # comparison above is deliberately compression-independent), but
      # each blob gains a table of contents that lets podman fetch only
      # the files it does not already have. Recompressing all ~400 layers
      # takes ~20 min of runner CPU, so the copy runs against a blob
      # cache seeded from the published images (see seed-blob-cache.sh):
      # unchanged layers substitute the registry's existing blobs —
      # HEAD-verified, and yielding a manifest byte-identical to a full
      # recompression — and only the real update delta is compressed and
      # uploaded. --dest-force-compress-format is load-bearing: without
      # it skopeo happily reuses the registry's same-digest gzip blobs
      # instead of converting (the first zstd push shipped 395 of 400
      # layers still gzip that way). Only the first tag is a real copy;
      # the other alias tags are manifest PUTs of the same bytes
      # (alias-tags.sh). Signing happens after, against the pushed
      # digest — sign what you publish. quay is the canonical target
      # (ledger 0033): it serves the multi-range requests partial pulls
      # need; the GHCR mirror step below is best-effort.
      - name: Push To Quay
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
          QUAY_USER: ${{ secrets.QUAY_ROBOT_USER }}
          QUAY_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        run: |
          set -euox pipefail
          # Released skopeo from its official image, pinned by digest
          # (Renovate-managed), instead of the runner's baked skopeo — a
          # -dev snapshot of git main, exactly the kind of unpinned moving
          # input this repo avoids. (The 403 originally blamed on that
          # build was really sudo-rs dropping the registry login: the old
          # `sudo -E skopeo` pushed anonymously, and GHCR refuses to issue
          # anonymous push-scope bearer tokens. Mounting the credentials
          # into the container, below, is what actually fixed it.)
          skopeo_image="quay.io/skopeo/stable:v1.22.2@sha256:17da3ac5cadf2b27a3dcf7dea857c4cea558ef757641725fc0eec560030057b3"
          mkdir -p /tmp/push-out
          cache_dir=${RUNNER_TEMP}/blob-cache
          # sudo throughout: the containerized skopeo runs as root and
          # owns the cache files it writes. A failed seeding only costs
          # CPU (full recompression), never correctness — warn and push.
          # Seed from both destinations: cache rows are scoped per
          # registry, so the canonical push and the GHCR mirror each
          # reuse only blobs their own registry already serves.
          sudo bash build_files/seed-blob-cache.sh \
            ${RUNNER_TEMP}/chunked-oci ${PUBLISH_REGISTRY}/${IMAGE_NAME}:latest ${cache_dir} \
            || echo "::warning::quay blob-cache seeding failed; this push recompresses every layer"
          sudo bash build_files/seed-blob-cache.sh \
            ${RUNNER_TEMP}/chunked-oci ${IMAGE_REGISTRY}/${IMAGE_NAME}:latest ${cache_dir} \
            || echo "::warning::ghcr blob-cache seeding failed; the mirror re-uploads every layer"

          # One real copy, to the first tag: conversion, blob uploads,
          # digestfile.
          set -- ${ALIAS_TAGS}
          first_tag=$1
          shift
          sudo podman run --rm \
            -v ${RUNNER_TEMP}/chunked-oci:/oci:ro \
            -v /tmp/push-out:/out \
            -v ${cache_dir}:/var/lib/containers/cache \
            -v "${HOME}/.docker/config.json:/auth.json:ro" \
            -e REGISTRY_AUTH_FILE=/auth.json \
            "${skopeo_image}" \
            copy --digestfile=/out/digestfile --image-parallel-copies 16 \
            --dest-compress-format zstd:chunked --dest-force-compress-format \
            oci:/oci docker://${PUBLISH_REGISTRY}/${IMAGE_NAME}:${first_tag}

          digest=$(< /tmp/push-out/digestfile)

          # The subshell drops xtrace: the bearer token alias-tags.sh
          # acquires is not a masked secret, and set -x would print the
          # credentials into the public log.
          ( set +x
            export ALIAS_CREDS="${QUAY_USER}:${QUAY_TOKEN}"
            bash build_files/alias-tags.sh quay.io \
              "${PUBLISH_REGISTRY#quay.io/}/${IMAGE_NAME}" "${digest}" "$@" )

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        # https://github.com/containers/container-libs/issues/388
        with:
          cosign-release: 'v2.6.5'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # Skip the Rekor transparency log: nothing in the podman/bootc
          # verification path consults it (verification is purely against
          # cosign.pub), and the upload adds a flaky network dependency.
          cosign sign --tlog-upload=false --key env://COSIGN_PRIVATE_KEY ${PUBLISH_REGISTRY}/${IMAGE_NAME}@${DIGEST}

      # Best-effort copy of the same bytes to GHCR, for registry
      # diversity and anything still pointed at the old address. Runs
      # after the canonical publish is signed, and never blocks it:
      # continue-on-error keeps a GHCR outage or quota hiccup from
      # failing a release that quay already serves. The digest assertion
      # is the point of the mirror — if the copy did not reproduce the
      # canonical manifest byte-for-byte, fail this step rather than
      # publish a divergent twin. The mirror is not separately signed;
      # cosign signatures live with the canonical quay image.
      - name: Mirror To GHCR
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euox pipefail
          skopeo_image="quay.io/skopeo/stable:v1.22.2@sha256:17da3ac5cadf2b27a3dcf7dea857c4cea558ef757641725fc0eec560030057b3"
          cache_dir=${RUNNER_TEMP}/blob-cache
          set -- ${ALIAS_TAGS}
          first_tag=$1
          shift
          sudo podman run --rm \
            -v ${RUNNER_TEMP}/chunked-oci:/oci:ro \
            -v /tmp/push-out:/out \
            -v ${cache_dir}:/var/lib/containers/cache \
            -v "${HOME}/.docker/config.json:/auth.json:ro" \
            -e REGISTRY_AUTH_FILE=/auth.json \
            "${skopeo_image}" \
            copy --digestfile=/out/mirror-digestfile --image-parallel-copies 16 \
            --dest-compress-format zstd:chunked --dest-force-compress-format \
            oci:/oci docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${first_tag}
          [ "$(< /tmp/push-out/mirror-digestfile)" = "${DIGEST}" ] || {
            echo "::error::mirror digest diverges from canonical ${DIGEST}"
            exit 1
          }
          ( set +x
            export ALIAS_CREDS="${GITHUB_ACTOR}:${GITHUB_TOKEN}"
            bash build_files/alias-tags.sh ghcr.io \
              "${IMAGE_REGISTRY#ghcr.io/}/${IMAGE_NAME}" "${DIGEST}" "$@" )

      # Populate the registry layer cache. Last, after the image is
      # published and signed: the cache is an optimization, and when this
      # step sat between the gate and the publish steps, its failure
      # dropped a gate-passing image (2026-08-13). It must still never
      # run for a build that failed its gate — --cache-to on the build
      # itself uploads entries as each step completes, podman never
      # overwrites an existing cache key, and a bad entry does not
      # self-heal (2026-08-12: a torn rpmdb from a failed build was
      # served to every later run; recovery is deleting that version
      # from the topaz-os-build-cache package). This re-run should be
      # all local cache hits — an instant re-upload of the layers the
      # gated build just made (each layer still self-verifies its rpm
      # database: census assert, sqlite integrity check, fatal rpm
      # stderr). Requires buildah >= 1.35 (see runs-on above);
      # buildah 1.33 never cache-served bind-mount RUN steps.
      #
      # REGISTRY_AUTH_FILE must be passed through sudo explicitly: root's
      # podman does not see the runner user's login (sudo resets HOME),
      # and GHCR refuses to issue anonymous bearer tokens for any request
      # that includes push scope — the first real cache push died on
      # exactly that 403 (2026-08-13).
      - name: Push Build Cache
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          CACHE_TO: ${{ format('{0}/{1}-build-cache', env.IMAGE_REGISTRY, env.IMAGE_NAME) }}
        run: |
          export REGISTRY_AUTH_FILE="${HOME}/.docker/config.json"
          sudo --preserve-env=CACHE_TO,REGISTRY_AUTH_FILE $(command -v just) build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # Companion to Start resource sampler above. Runs on failure too —
      # that is the run whose trace matters.
      - name: Report resource usage
        if: always()
        run: |
          cat ${RUNNER_TEMP}/resources.log || echo "no samples collected"
          echo "--- kernel OOM events (empty is good) ---"
          sudo dmesg | grep -iE 'out of memory|oom[-_ ]kill' | tail -20 || true

