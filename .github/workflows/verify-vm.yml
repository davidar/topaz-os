---
name: Verify VM boot

# Boots an image in QEMU on the runner, logs into the niri (topaz)
# session and runs every suite (tests/README.md). Called from build.yml
# after every image build: a pull request's run boots the image that PR built
# (pushed to a pr-<N> tag on the GHCR mirror for the purpose), and a
# main push boots the signed identity tag it just pushed — :latest is
# aliased onto that digest only after this passes, so an image that
# does not boot never reaches a machine. The harness therefore always
# meets the image tree it was changed alongside — a harness change that
# depended on an image change in the same PR used to fail here until
# the image was published (PR #50). Dispatch it by hand to boot any
# image.
#
# The runner has no GPU, so the harness hosts the guest's GL on llvmpipe
# via SDL's offscreen driver; KVM is available on standard GitHub
# runners. The whole harness runs rootful: bootc-image-builder needs
# root anyway, and a single root container storage halves the disk
# footprint of the 13 GB image.

on:
  workflow_call:
    inputs:
      image:
        description: "Image to boot-test (build.yml passes a digest reference)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image:
        description: "Image to boot-test"
        required: false
        default: "quay.io/davidar/topaz-os:latest"

permissions:
  contents: read

env:
  TEST_IMAGE: ${{ inputs.image || 'quay.io/davidar/topaz-os:latest' }}

jobs:
  verify-vm:
    name: Boot and verify in QEMU
    # Same runner as build.yml. The rootful bootc-image-builder path needs
    # the AppArmor step below on this image.
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      # Same sampler as build.yml: the disk-build peak (image in root
      # storage + osbuild tree + raw disk + qcow2) is the tight resource
      # here — if the job dies of exhaustion, let it name itself.
      - name: Start resource sampler
        run: |
          cat > ${RUNNER_TEMP}/sample.sh <<'EOF'
          while true; do
            printf '%s avail_mem=%sMiB tmp_used=%sMiB root_free=%sMiB\n' \
              "$(date -u +%H:%M:%S)" \
              "$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)" \
              "$(df -m --output=used /tmp | tail -1 | tr -d ' ')" \
              "$(df -m --output=avail / | tail -1 | tr -d ' ')"
            sleep 15
          done
          EOF
          nohup bash ${RUNNER_TEMP}/sample.sh >> ${RUNNER_TEMP}/resources.log 2>/dev/null &

      - name: Install QEMU
        # The mesa/EGL packages back the guest's virtio GL on llvmpipe;
        # --no-install-recommends leaves them out and QEMU dies at
        # startup with "Couldn't open libEGL.so.1" (run 33232099963).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-gui qemu-utils ovmf \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libgles2

      - name: Pull image under test
        run: |
          sudo podman pull "$TEST_IMAGE"
          sudo podman tag "$TEST_IMAGE" localhost/topaz-os:test

      - name: Unload the bwrap AppArmor profile
        # Ubuntu's bwrap-userns-restrict profile attaches by executable
        # path to every /usr/bin/bwrap exec, even inside the unconfined
        # privileged builder container, and its unpriv_bwrap child profile
        # denies chown and sys_admin, which is how osbuild runs its stages.
        # The 26.04 runner image enforces it (run 39098996641; probe
        # 39100359279 named it, run 39103374038 built a disk without it).
        run: |
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi

      - name: Boot and verify
        # The niri (topaz) session, the one machines run (ledger 0041),
        # and every suite in one booted guest: the post-boot state, a
        # lock and unlock, the fade before the idle lock with its knob
        # file, then a logout and login. relogin-cycle goes last because
        # it churns the session the others measure. sudo resets the
        # environment, so the session choice rides on env.
        run: >
          sudo env TOPAZ_TEST_SESSION=topaz-niri
          bash tests/run.sh all boot-verify lock-unlock idle-fade relogin-cycle

      - name: Kernel denials (debug)
        if: failure()
        run: sudo dmesg | grep -iE 'apparmor|denied|audit' | tail -40 || true

      - name: Collect evidence
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" tests/.artifacts || true
          cat ${RUNNER_TEMP}/resources.log || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-evidence
          path: |
            tests/.artifacts/serial.log
            tests/.artifacts/journal-user.log
            tests/.artifacts/journal-system.log
            tests/.artifacts/coredumps.log
            tests/.artifacts/session-state.log
            tests/.artifacts/screens/
          if-no-files-found: ignore
          retention-days: 14
