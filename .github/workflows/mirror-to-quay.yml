# Mirror published tags from GHCR to quay.io (manual dispatch).
#
# GHCR rejects the multi-range blob requests that zstd:chunked partial
# pulls are made of (501 Unsupported client range), so the delta-update
# path (ledger 0031) cannot engage against it. quay.io serves those
# request shapes correctly; this workflow copies already-published tags
# there so partial pulls can be evaluated (and, if adopted, served)
# from a registry that supports them. Blobs are streamed as-is —
# --preserve-digests means any re-encoding fails the copy loudly, so
# the mirrored manifest and its TOC annotations are byte-identical to
# what CI published and verified.
name: Mirror to Quay

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Space-separated tags to mirror
        default: latest-20260815-84e6fb8 latest
        required: true

env:
  SOURCE_IMAGE: ghcr.io/davidar/topaz-os
  DEST_IMAGE: quay.io/davidar/topaz-os

jobs:
  mirror:
    name: Mirror tags to quay.io
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      # Same released, digest-pinned skopeo as the push step in
      # build.yml — never the runner's baked -dev snapshot.
      - name: Copy tags
        env:
          TAGS: ${{ inputs.tags }}
          QUAY_USER: ${{ secrets.QUAY_ROBOT_USER }}
          QUAY_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        run: |
          set -euo pipefail
          skopeo_image="quay.io/skopeo/stable:v1.22.2@sha256:c7d3c512612f52805023cd38351081dad7e2729fc13d14b701e47c7c8bdd6615"
          for tag in ${TAGS}; do
            echo "::group::${tag}"
            docker run --rm -e QUAY_USER -e QUAY_TOKEN "${skopeo_image}" \
              copy --preserve-digests --image-parallel-copies 16 \
              --dest-creds "${QUAY_USER}:${QUAY_TOKEN}" \
              "docker://${SOURCE_IMAGE}:${tag}" \
              "docker://${DEST_IMAGE}:${tag}"
            echo "::endgroup::"
          done
