# On-screen display for the niri (topaz) session (ledger 0041). Fed by
# topaz-osd through the topaz-osd.socket FIFO; colours follow the COSMIC
# dark theme so it sits with the panel. Per-user override:
# ~/.config/wob/wob.ini.
timeout = 1000
max = 100
anchor = bottom center
margin = 120
width = 320
height = 24
border_offset = 0
border_size = 2
bar_padding = 4
border_radius = 12
bar_radius = 8
background_color = 1e1e1ee6
border_color = 3f3f3fff
bar_color = 3f8de6ff
