# Written by topaz-os (topaz-grub-entries.service); replaced on update while this line is intact.
# To keep a custom.cfg of your own, change or remove the line above.

# Windows, found at boot by its loader's standard path on an EFI partition.
# The entry is absent when the loader is.
if search --no-floppy --file --set=winesp /EFI/Microsoft/Boot/bootmgfw.efi; then
    menuentry 'Windows' --id windows {
        insmod chain
        set root=$winesp
        chainloader /EFI/Microsoft/Boot/bootmgfw.efi
    }
fi
