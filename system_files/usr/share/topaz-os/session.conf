# Knobs for the niri (topaz) session's units (ledger 0046).
#
# Copy this file to ~/.config/topaz/session.conf and uncomment what you
# change; topaz-idle.service reads it as an EnvironmentFile, and unset
# knobs keep the defaults shown. Values are seconds of idle time; 0
# switches that stage off. Apply a change with
#   systemctl --user restart topaz-idle.service

# Lock the screen after this long without input.
#TOPAZ_IDLE_LOCK=300

# Fade the screen to black for this long before the lock, as the warning;
# any input during the fade cancels both the fade and that lock. Must be
# shorter than TOPAZ_IDLE_LOCK, or the lock arrives without a fade.
#TOPAZ_IDLE_WARN=30

# Power the outputs off; they come back on at the next input.
#TOPAZ_IDLE_BLANK=600

# Suspend. The screen is locked before any sleep regardless of this.
#TOPAZ_IDLE_SUSPEND=1800

# Wallpaper: an image file, or a GNOME timed-wallpaper XML such as the
# ones under /usr/share/backgrounds/bluefin/. Unset, the session paints
# the wallpaper the base image pins for GNOME, on its day/night schedule
# (ledger 0048). Apply with
#   systemctl --user restart topaz-background.service
#TOPAZ_WALLPAPER=/usr/share/backgrounds/bluefin/01-bluefin.xml
