# topaz-os: the keyring daemon's memory never goes to swap. oo7-daemon
# tries to mlockall() and is refused under the user manager's 8 MiB
# RLIMIT_MEMLOCK ("Failed to lock memory pages (secrets may be swapped to
# disk)"), and this image swaps to a file on disk. A cgroup swap limit of
# zero keeps its pages in RAM without raising the limit for every user
# process.
[Service]
MemorySwapMax=0
