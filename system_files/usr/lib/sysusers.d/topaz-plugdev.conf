# The base image ships udev rules (70-u2f.rules, 50-zsa.rules,
# 10-switch.rules) that grant device access to the Debian-style "plugdev"
# group, which Fedora does not define. Declaring the group silences ~100
# "unknown group" errors per boot and makes those grants functional.
# See ledger entry 0021.
g plugdev -
