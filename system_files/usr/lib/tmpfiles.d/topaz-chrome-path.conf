# Google Chrome (Flatpak) at the path automation tools expect.
# Playwright and similar tools hardcode /opt/google/chrome/chrome; on this
# image Chrome is a Flatpak, so recreate the expected path as a symlink to
# the Flatpak export on every boot. Dangling (harmless) if Chrome is not
# installed as a system Flatpak.
d /var/opt/google 0755 root root -
d /var/opt/google/chrome 0755 root root -
L+ /var/opt/google/chrome/chrome - - - - /var/lib/flatpak/exports/bin/com.google.Chrome
