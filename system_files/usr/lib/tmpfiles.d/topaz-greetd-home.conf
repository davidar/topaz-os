# greetd's home directory, owned by the greeter user (ledger 0045).
# sysusers.d names it and the package's tmpfiles.d rule only relabels an
# existing one; /var ships empty (ledger 0024), so the directory would
# otherwise come into being as the root-owned parent of the portal mask's
# entries, and the greeter could not write to its own home. tuigreet
# keeps its remembered user and session there: Fedora's build stores
# them as /var/lib/greetd/tuigreet-* rather than under /var/cache.
d /var/lib/greetd 0755 greetd greetd - -
