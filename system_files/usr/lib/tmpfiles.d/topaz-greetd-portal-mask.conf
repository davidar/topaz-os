# Mask xdg-desktop-portal for the greeter user. The greetd package
# arranges this mask inside greetd's home directory, but that lives under
# /var — machine state the image must not ship (ledger 0024) — so the
# mask is recreated declaratively at boot instead.
d /var/lib/greetd/.config 0755 greetd greetd - -
d /var/lib/greetd/.config/systemd 0755 greetd greetd - -
d /var/lib/greetd/.config/systemd/user 0755 greetd greetd - -
L /var/lib/greetd/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null
