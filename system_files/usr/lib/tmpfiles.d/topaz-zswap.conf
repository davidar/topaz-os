# zswap in front of the disk swapfile (ledger 0042): swapped pages are
# compressed into a RAM pool first, and the LRU shrinker writes the oldest
# ones out to disk as the pool fills, so cold memory ages out to the SSD
# instead of leaving the OOM killer as the only release valve. The
# compressor is set before the pool is enabled.
w /sys/module/zswap/parameters/compressor - - - - zstd
w /sys/module/zswap/parameters/shrinker_enabled - - - - Y
w /sys/module/zswap/parameters/enabled - - - - Y
